[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-viser"
version = "0.1.0"
description = "Reference browser viewer for scene-aligned bimanual LeRobot demonstrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "viser>=1.1.1,<1.2", "numpy>=2.2,<3", "scipy>=1.15,<2",
  "pyarrow>=19,<27", "av>=14,<20", "pillow>=11,<14",
  "plyfile>=1.1,<2", "huggingface-hub>=1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
kiwi-viser = "kiwi_viser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
